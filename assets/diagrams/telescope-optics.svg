<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="telescope-title telescope-desc">
  <title id="telescope-title">114/900 Newtonian Optical Tube Cross-Section</title>
  <desc id="telescope-desc">Technical cross-section showing primary parabolic mirror D=114mm, 45-degree secondary diagonal mirror, optical axis, focal length f=900mm, and terracotta converging light rays.</desc>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-terracotta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9E5438"/>
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F6D5E"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4F6D5E" stroke-width="0.8" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Subtle drafting grid -->
  <g stroke="#D8D6CE" stroke-width="0.5" opacity="0.45">
    <line x1="40" y1="40" x2="760" y2="40"/>
    <line x1="40" y1="380" x2="760" y2="380"/>
    <line x1="40" y1="40" x2="40" y2="380"/>
    <line x1="760" y1="40" x2="760" y2="380"/>
  </g>

  <!-- Header metadata inside plate -->
  <text x="54" y="64" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4F6D5E" letter-spacing="1.2">SEC A-A // NEWTONIAN OTA SCHEMATIC (D=114 MM, F=900 MM, F/7.89)</text>

  <!-- Optical Axis (dashed) -->
  <line x1="75" y1="220" x2="735" y2="220" stroke="#4F6D5E" stroke-width="1" stroke-dasharray="8 4 2 4"/>
  <text x="690" y="212" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#4F6D5E">OPTICAL AXIS</text>

  <!-- Optical Tube Walls (cross-section) -->
  <!-- Top wall with focuser aperture cutout (x=220..268) -->
  <rect x="130" y="138" width="90" height="8" fill="#E4ECE8" stroke="#232624" stroke-width="1.4"/>
  <rect x="268" y="138" width="412" height="8" fill="#E4ECE8" stroke="#232624" stroke-width="1.4"/>
  <!-- Bottom wall -->
  <rect x="130" y="294" width="550" height="8" fill="#E4ECE8" stroke="#232624" stroke-width="1.4"/>

  <!-- Focuser drawtube & eyepiece holder -->
  <rect x="220" y="100" width="8" height="46" fill="#E4ECE8" stroke="#232624" stroke-width="1.3"/>
  <rect x="260" y="100" width="8" height="46" fill="#E4ECE8" stroke="#232624" stroke-width="1.3"/>
  <line x1="214" y1="100" x2="274" y2="100" stroke="#232624" stroke-width="1.4"/>
  <line x1="244" y1="74" x2="244" y2="220" stroke="#4F6D5E" stroke-width="0.9" stroke-dasharray="5 3"/>

  <!-- Rear Mirror Cell & Collimation Screws -->
  <rect x="668" y="146" width="12" height="148" fill="url(#hatch)" stroke="#232624" stroke-width="1.2"/>
  <line x1="680" y1="176" x2="696" y2="176" stroke="#232624" stroke-width="2"/>
  <line x1="680" y1="264" x2="696" y2="264" stroke="#232624" stroke-width="2"/>

  <!-- Primary Parabolic Mirror (D = 114mm represented between y=156 and y=284) -->
  <path d="M 656 156 Q 646 220 656 284 L 668 284 L 668 156 Z" fill="#E4ECE8" stroke="#232624" stroke-width="1.6"/>
  <path d="M 656 156 Q 646 220 656 284" fill="none" stroke="#4F6D5E" stroke-width="1.8"/>

  <!-- Secondary Diagonal Mirror (45 deg) + Spider Vane -->
  <line x1="244" y1="146" x2="244" y2="205" stroke="#525653" stroke-width="1.2"/>
  <line x1="244" y1="235" x2="244" y2="294" stroke="#525653" stroke-width="1.2"/>
  <polygon points="230,206 258,234 252,240 224,212" fill="#E4ECE8" stroke="#232624" stroke-width="1.5"/>

  <!-- Incoming Parallel Rays & Converging Path (Terracotta) -->
  <!-- Top incoming ray -->
  <line x1="80" y1="166" x2="200" y2="166" stroke="#9E5438" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <line x1="200" y1="166" x2="653" y2="166" stroke="#9E5438" stroke-width="1.5"/>
  <!-- Bottom incoming ray -->
  <line x1="80" y1="274" x2="200" y2="274" stroke="#9E5438" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  <line x1="200" y1="274" x2="653" y2="274" stroke="#9E5438" stroke-width="1.5"/>

  <!-- Reflected converging rays from primary to secondary -->
  <line x1="653" y1="166" x2="251" y2="227" stroke="#9E5438" stroke-width="1.4" marker-end="url(#arrow-terracotta)"/>
  <line x1="653" y1="274" x2="237" y2="213" stroke="#9E5438" stroke-width="1.4" marker-end="url(#arrow-terracotta)"/>

  <!-- Reflected rays from secondary up to focal plane at (244, 88) -->
  <line x1="251" y1="227" x2="244" y2="88" stroke="#9E5438" stroke-width="1.4"/>
  <line x1="237" y1="213" x2="244" y2="88" stroke="#9E5438" stroke-width="1.4"/>

  <!-- Focal plane marker -->
  <line x1="226" y1="88" x2="262" y2="88" stroke="#9E5438" stroke-width="1.6"/>
  <circle cx="244" cy="88" r="3" fill="#9E5438"/>

  <!-- Dimension Lines & Technical Callouts -->
  <!-- Primary Mirror Diameter D = 114 mm -->
  <line x1="656" y1="156" x2="726" y2="156" stroke="#767A77" stroke-width="0.8"/>
  <line x1="656" y1="284" x2="726" y2="284" stroke="#767A77" stroke-width="0.8"/>
  <line x1="718" y1="160" x2="718" y2="280" stroke="#232624" stroke-width="1" marker-start="url(#arrow-sage)" marker-end="url(#arrow-sage)"/>
  <text x="725" y="224" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#232624">D = 114 mm</text>

  <!-- Effective Optical Path Length (f = 900 mm) -->
  <line x1="244" y1="220" x2="244" y2="348" stroke="#767A77" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="650" y1="284" x2="650" y2="348" stroke="#767A77" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="248" y1="338" x2="646" y2="338" stroke="#232624" stroke-width="1" marker-start="url(#arrow-sage)" marker-end="url(#arrow-sage)"/>
  <text x="365" y="356" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#232624">f - b = 768 mm (TUBE SPAN)</text>

  <!-- Callout Labels -->
  <text x="278" y="84" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9E5438">FOCAL PLANE (b = 132 mm)</text>
  <line x1="250" y1="88" x2="274" y2="82" stroke="#9E5438" stroke-width="0.9"/>

  <text x="285" y="182" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#232624">45 DEG SECONDARY FLAT</text>
  <text x="285" y="196" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#525653">MINOR AXIS = 28 mm (24.5% OBSTR.)</text>
  <line x1="250" y1="215" x2="282" y2="188" stroke="#525653" stroke-width="0.9"/>

  <text x="515" y="124" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#232624">PARABOLIC PRIMARY (z = r^2 / 4f)</text>
  <line x1="654" y1="164" x2="615" y2="128" stroke="#525653" stroke-width="0.9"/>

  <text x="80" y="152" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9E5438">COLLIMATED</text>
  <text x="80" y="162" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9E5438">STARLIGHT</text>
</svg>
