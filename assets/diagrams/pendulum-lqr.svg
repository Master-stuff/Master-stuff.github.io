<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="pendulum-title pendulum-desc">
  <title id="pendulum-title">Inverted Double Pendulum on a Cart Free-Body and LQR Control Diagram</title>
  <desc id="pendulum-desc">Free-body diagram of a motorized cart of mass M with control force F, lower link angle theta_1, upper link angle theta_2, and state-feedback LQR loop u = -Kx.</desc>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="force-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9E5438"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F6D5E"/>
    </marker>
  </defs>

  <rect x="28" y="28" width="744" height="364" fill="none" stroke="#D8D6CE" stroke-width="0.8"/>
  <text x="44" y="52" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4F6D5E" letter-spacing="1.2">FIG 03 // DOUBLE INVERTED PENDULUM FBD + LQR STATE FEEDBACK (6-DOF)</text>

  <!-- Ground track -->
  <line x1="60" y1="322" x2="430" y2="322" stroke="#232624" stroke-width="1.8"/>
  <!-- Track hatch marks -->
  <g stroke="#767A77" stroke-width="1">
    <line x1="70" y1="322" x2="62" y2="332"/>
    <line x1="100" y1="322" x2="92" y2="332"/>
    <line x1="130" y1="322" x2="122" y2="332"/>
    <line x1="160" y1="322" x2="152" y2="332"/>
    <line x1="190" y1="322" x2="182" y2="332"/>
    <line x1="220" y1="322" x2="212" y2="332"/>
    <line x1="250" y1="322" x2="242" y2="332"/>
    <line x1="280" y1="322" x2="272" y2="332"/>
    <line x1="310" y1="322" x2="302" y2="332"/>
    <line x1="340" y1="322" x2="332" y2="332"/>
    <line x1="370" y1="322" x2="362" y2="332"/>
    <line x1="400" y1="322" x2="392" y2="332"/>
  </g>

  <!-- Reference origin x=0 -->
  <line x1="130" y1="265" x2="130" y2="355" stroke="#4F6D5E" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="118" y="368" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#4F6D5E">x=0</text>

  <!-- Cart of mass M centered at x=230 -->
  <rect x="180" y="268" width="100" height="42" fill="#E4ECE8" stroke="#232624" stroke-width="1.6"/>
  <circle cx="200" cy="316" r="6" fill="#FFFFFF" stroke="#232624" stroke-width="1.5"/>
  <circle cx="260" cy="316" r="6" fill="#FFFFFF" stroke="#232624" stroke-width="1.5"/>
  <text x="218" y="294" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#232624" font-weight="500">M</text>

  <!-- Cart displacement x arrow -->
  <line x1="130" y1="348" x2="226" y2="348" stroke="#4F6D5E" stroke-width="1.2" marker-end="url(#axis-arrow)"/>
  <line x1="230" y1="310" x2="230" y2="355" stroke="#4F6D5E" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="172" y="343" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4F6D5E">x(t)</text>

  <!-- Control Force F = u (Terracotta) -->
  <line x1="126" y1="289" x2="176" y2="289" stroke="#9E5438" stroke-width="2.2" marker-end="url(#force-arrow)"/>
  <text x="72" y="284" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9E5438" font-weight="500">F = u(t)</text>

  <!-- Vertical reference at Pivot 1 (230, 268) -->
  <line x1="230" y1="150" x2="230" y2="268" stroke="#4F6D5E" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Link 1: Pivot (230, 268) to Joint 2 (262, 178) -->
  <line x1="230" y1="268" x2="262" y2="178" stroke="#232624" stroke-width="4"/>
  <line x1="230" y1="268" x2="262" y2="178" stroke="#E4ECE8" stroke-width="1.6"/>
  <circle cx="230" cy="268" r="4.5" fill="#FFFFFF" stroke="#232624" stroke-width="1.5"/>
  <!-- Angle arc theta_1 -->
  <path d="M 230 228 A 40 40 0 0 1 243 230" fill="none" stroke="#9E5438" stroke-width="1.3"/>
  <text x="234" y="220" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9E5438">theta_1</text>
  <text x="262" y="232" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#525653">l_1, m_1</text>

  <!-- Vertical reference at Joint 2 (262, 178) -->
  <line x1="262" y1="78" x2="262" y2="178" stroke="#4F6D5E" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Link 2: Joint 2 (262, 178) to Tip (305, 92) -->
  <line x1="262" y1="178" x2="305" y2="92" stroke="#232624" stroke-width="4"/>
  <line x1="262" y1="178" x2="305" y2="92" stroke="#E4ECE8" stroke-width="1.6"/>
  <circle cx="262" cy="178" r="4.5" fill="#FFFFFF" stroke="#232624" stroke-width="1.5"/>
  <circle cx="305" cy="92" r="4" fill="#9E5438"/>
  <!-- Angle arc theta_2 -->
  <path d="M 262 138 A 40 40 0 0 1 280 142" fill="none" stroke="#9E5438" stroke-width="1.3"/>
  <text x="268" y="130" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9E5438">theta_2</text>
  <text x="296" y="146" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#525653">l_2, m_2</text>

  <!-- Gravity Vector -->
  <line x1="365" y1="100" x2="365" y2="145" stroke="#232624" stroke-width="1.4" marker-end="url(#axis-arrow)"/>
  <text x="373" y="128" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#232624">g = 9.81 m/s^2</text>

  <!-- Right Panel: State-Space LQR Control Loop -->
  <line x1="445" y1="70" x2="445" y2="372" stroke="#D8D6CE" stroke-width="1"/>
  <text x="468" y="92" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#232624" font-weight="500">LQR REGULATOR ARCHITECTURE</text>

  <!-- Summing junction & Reference -->
  <text x="468" y="160" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#525653">x_ref = 0</text>
  <line x1="525" y1="156" x2="554" y2="156" stroke="#232624" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
  <circle cx="564" cy="156" r="8" fill="#FFFFFF" stroke="#232624" stroke-width="1.3"/>
  <text x="560" y="160" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#232624">-</text>

  <!-- Plant Block -->
  <line x1="572" y1="156" x2="612" y2="156" stroke="#9E5438" stroke-width="1.5" marker-end="url(#force-arrow)"/>
  <text x="580" y="148" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9E5438">u</text>
  <rect x="615" y="128" width="128" height="56" fill="#E4ECE8" stroke="#232624" stroke-width="1.4"/>
  <text x="630" y="152" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#232624">PLANT DYNAMICS</text>
  <text x="626" y="169" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#525653">dx/dt = Ax + Bu</text>

  <!-- Output x(t) and Feedback Gain K -->
  <line x1="743" y1="156" x2="762" y2="156" stroke="#232624" stroke-width="1.3"/>
  <line x1="752" y1="156" x2="752" y2="238" stroke="#232624" stroke-width="1.3"/>
  <line x1="752" y1="238" x2="692" y2="238" stroke="#232624" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
  <text x="724" y="146" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#232624">x(t)</text>

  <rect x="596" y="216" width="92" height="44" fill="#FFFFFF" stroke="#4F6D5E" stroke-width="1.4"/>
  <text x="615" y="236" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4F6D5E" font-weight="500">GAIN K</text>
  <text x="608" y="250" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#525653">K = R^-1 B^T P</text>

  <polyline points="596,238 564,238 564,166" fill="none" stroke="#4F6D5E" stroke-width="1.3" marker-end="url(#axis-arrow)"/>

  <!-- State vector summary box -->
  <rect x="468" y="286" width="275" height="72" fill="#FFFFFF" stroke="#D8D6CE" stroke-width="1"/>
  <text x="480" y="306" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#4F6D5E">STATE VECTOR (R^6)</text>
  <text x="480" y="324" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#232624">x = [x, theta_1, theta_2, x_dot, th1_dot, th2_dot]^T</text>
  <text x="480" y="344" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#525653">J = int( x^T Q x + u^T R u ) dt</text>
</svg>
